name: CI

on:
  push:
    branches: [teste, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  ssr-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix examples/ssr-fixtures install
      - run: npx --prefix examples/ssr-fixtures playwright install --with-deps chromium
      - run: npm --prefix examples/ssr-fixtures run test:e2e
        env:
          CI: true

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm --prefix extensions/vscode-fiboui test
      - run: npm --prefix extensions/fiboui-noir-theme test
      - name: Package VSIX
        working-directory: extensions/vscode-fiboui
        run: npx --yes @vscode/vsce package --out /tmp/fiboui-ci.vsix
      - name: Package theme VSIX
        working-directory: extensions/fiboui-noir-theme
        run: npx --yes @vscode/vsce package --out /tmp/fiboui-noir-ci.vsix

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (git history, redacted)
        run: bash scripts/secret-scan.sh --git
