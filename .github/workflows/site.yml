name: Site

on:
  push:
    branches: [main]
    paths:
      - 'examples/site/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'examples/site/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --ignore-scripts --prefix examples/site
      - run: npm run build --prefix examples/site
