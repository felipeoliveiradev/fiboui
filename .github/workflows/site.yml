name: Site

on:
  push:
    branches: [main]
    paths:
      - 'examples/site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'examples/site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: examples/site/package-lock.json
      - run: npm ci --prefix examples/site
      - run: npm run build --prefix examples/site
