<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="FiboUI  Fluent React UI">
  <defs>
    <linearGradient id="pinkFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2d8a"/>
      <stop offset="100%" stop-color="#c41a6a"/>
    </linearGradient>
  </defs>

  <!-- Ink top -->
  <rect width="1280" height="220" fill="#0a0a0a"/>
  <!-- Pink plane -->
  <rect y="220" width="1280" height="200" fill="url(#pinkFade)"/>

  <!-- Logo mark -->
  <g transform="translate(48 36)">
    <rect width="10" height="10" fill="#ffffff"/>
    <rect y="12" width="10" height="10" fill="#ffffff"/>
    <rect x="12" width="22" height="22" fill="#c8ff00"/>
  </g>
  <text x="96" y="58"
    font-family="Geist, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="18" font-weight="700" letter-spacing="0.28em"
    fill="#ffffff">FIBOUI</text>

  <!-- Hero wordmark -->
  <text x="48" y="168"
    font-family="Geist, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="96" font-weight="800" letter-spacing="-0.04em"
    fill="#ffffff">FIBOUI</text>

  <!-- Microcopy on pink -->
  <text x="48" y="258"
    font-family="Geist, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" letter-spacing="0.18em"
    fill="#ffffff">TAILORED TO EACH REQUEST</text>
  <text x="900" y="258"
    font-family="Geist, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" letter-spacing="0.18em"
    fill="#ffffff" text-anchor="end">ATTENTION TO DETAIL</text>

  <!-- Tagline -->
  <text x="48" y="320"
    font-family="Geist, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="28" font-weight="700" letter-spacing="-0.02em"
    fill="#ffffff">Fluent React UI. There is no JSX.</text>
  <text x="48" y="358"
    font-family="Geist, Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="16" font-weight="500" letter-spacing="0.04em"
    fill="#ffffff" opacity="0.85">Builders · Signals · Theme · Motion · Media</text>

  <!-- Accent squares -->
  <rect x="1120" y="300" width="72" height="72" fill="#c8ff00"/>
  <rect x="1168" y="348" width="40" height="40" fill="#ffffff"/>
</svg>
