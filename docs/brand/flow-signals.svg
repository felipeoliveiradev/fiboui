<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="FiboUI signal flow">
  <rect width="960" height="300" fill="#0a0a0a"/>

  <text x="32" y="36"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="11" font-weight="700" letter-spacing="0.2em"
    fill="#ff2d8a">SIGNAL FLOW</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="60" y="90" width="160" height="100" fill="#141414" stroke="#ff2d8a" stroke-width="1.5"/>
    <text x="140" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#ff2d8a">signal(0)</text>
    <text x="140" y="154" text-anchor="middle" font-size="11" fill="#9a9a9a">source of truth</text>

    <rect x="300" y="90" width="180" height="100" fill="#141414" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="390" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">.bindSignal()</text>
    <text x="390" y="154" text-anchor="middle" font-size="11" fill="#9a9a9a">subscribe / re-assemble</text>

    <rect x="560" y="90" width="180" height="100" fill="#141414" stroke="#c8ff00" stroke-width="1.5"/>
    <text x="650" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#c8ff00">() =&gt; children</text>
    <text x="650" y="154" text-anchor="middle" font-size="11" fill="#9a9a9a">read .value live</text>

    <rect x="800" y="105" width="120" height="70" fill="#c8ff00"/>
    <text x="860" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#0a0a0a">UI</text>
  </g>

  <g stroke="#ffffff" stroke-width="1.5" fill="none" stroke-opacity="0.45">
    <path d="M220 140 H292"/>
    <path d="M480 140 H552"/>
    <path d="M740 140 H792"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.45">
    <polygon points="292,134 300,140 292,146"/>
    <polygon points="552,134 560,140 552,146"/>
    <polygon points="792,134 800,140 792,146"/>
  </g>

  <path d="M860 175 C860 240 140 240 140 190" fill="none" stroke="#ff2d8a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="480" y="262" text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="12" fill="#ff2d8a">onPress -&gt; count.value += 1 -&gt; tree refreshes</text>
</svg>
