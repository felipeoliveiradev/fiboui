<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="FiboUI package architecture">
  <rect width="960" height="340" fill="#0a0a0a"/>

  <text x="32" y="36"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="11" font-weight="700" letter-spacing="0.2em"
    fill="#ffffff">PACKAGE ARCHITECTURE</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="32" y="60" width="896" height="56" fill="#141414" stroke="#c8ff00" stroke-width="1.5"/>
    <text x="52" y="94" font-size="14" font-weight="800" fill="#c8ff00">your app</text>
    <text x="160" y="94" font-size="12" fill="#9a9a9a">mount / screens / domain</text>

    <rect x="32" y="140" width="210" height="72" fill="#141414" stroke="#ff2d8a" stroke-width="1.5"/>
    <text x="52" y="172" font-size="13" font-weight="800" fill="#ff2d8a">layout / content</text>
    <text x="52" y="194" font-size="11" fill="#9a9a9a">Column / Text / Button</text>

    <rect x="262" y="140" width="210" height="72" fill="#141414" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="282" y="172" font-size="13" font-weight="800" fill="#ffffff">structure / nav</text>
    <text x="282" y="194" font-size="11" fill="#9a9a9a">Box / Scaffold / Grid</text>

    <rect x="492" y="140" width="210" height="72" fill="#141414" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="512" y="172" font-size="13" font-weight="800" fill="#ffffff">theme / motion</text>
    <text x="512" y="194" font-size="11" fill="#9a9a9a">noir / animate / hover</text>

    <rect x="722" y="140" width="206" height="72" fill="#141414" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="742" y="172" font-size="13" font-weight="800" fill="#ffffff">reactivity</text>
    <text x="742" y="194" font-size="11" fill="#9a9a9a">signal / computed</text>

    <rect x="32" y="236" width="896" height="64" fill="#c8ff00"/>
    <text x="52" y="274" font-size="14" font-weight="800" fill="#0a0a0a">core - FiboBuilder / styleManager / bindSignal / mount</text>
  </g>
</svg>
